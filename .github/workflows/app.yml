name: App container

# main     -> :edge, :sha-<sha>   (for testing)
# app-vX.Y.Z tag -> :X.Y.Z, :stable  (devices track :stable and update themselves)
on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/app.yml']
    tags: ['app-v*']
  pull_request:
    paths: ['app/**', '.github/workflows/app.yml']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}/app

jobs:
  build:
    # Native arm64 runner: free for public repos, no emulation
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=match,pattern=app-v(.*),group=1
            type=raw,value=stable,enable=${{ startsWith(github.ref, 'refs/tags/app-v') }}
            type=edge,branch=main
            type=sha
            type=ref,event=pr

      - uses: docker/setup-buildx-action@v4

      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: app
          file: app/Containerfile
          platforms: linux/arm64
          build-args: APP_VERSION=${{ steps.meta.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          push: ${{ github.event_name != 'pull_request' }}
          # Plain single-arch manifest: what devices pull and auto-update compares
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

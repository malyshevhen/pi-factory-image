# The image renames the stock "pi" user to @DEVICE_USER@; tell cloud-init so it
# installs ssh keys for that user instead of re-creating "pi".
system_info:
  default_user:
    name: @DEVICE_USER@
    lock_passwd: true
    gecos: Device admin
    groups: [adm, dialout, cdrom, audio, users, sudo, video, plugdev, input, gpio, spi, i2c, netdev, render]
    sudo: ["ALL=(ALL) NOPASSWD:ALL"]
    shell: /bin/bash

ssh_pwauth: false
